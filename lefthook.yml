colors: true
min_version: 2.1.16

pre-commit:
  parallel: true # run all commands concurrently
  commands:
    "ESLint lint":
      run: pnpm lint:fix {staged_files}
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
      stage_fixed: true

    "biome format":
      run: pnpm format {staged_files}
      glob:
        - "*.ts"
        - "*.tsx"
        - ".js"
        - "*.json"
      stage_fixed: true

commit-msg:
  commands:
    "lint commit message":
      run: pnpm exec commitlint --edit {1}
